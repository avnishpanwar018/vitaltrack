name: vitaltrack
description: VitalTrack - Modern Blood Pressure & Health Tracking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # UI & Charts
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.0
  equatable: ^2.0.7

  # Storage & Security
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3

  # Notifications
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.1.1
  timezone: ^0.10.0

  # Reports & Export
  pdf: ^3.11.1
  csv: ^6.0.0
  share_plus: ^10.1.4
  printing: ^5.13.4

  # Media & Files
  image_picker: ^1.1.2
  file_picker: ^8.1.7

  # Navigation
  go_router: ^14.6.3
  web: ^1.1.0

  # Icons
  cupertino_icons: ^1.0.8

  # Future-ready (Firebase - optional sync)
  # firebase_core: ^3.9.0
  # firebase_auth: ^5.4.0
  # cloud_firestore: ^5.6.1

  # Home Widget (Android)
  home_widget: ^0.7.0
  sqflite_common_ffi: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/images/
